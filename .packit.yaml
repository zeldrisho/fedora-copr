packages:
  actionlint:
    specfile_path: actionlint.spec
    downstream_package_name: actionlint
    paths: [packages/actionlint, .packit, .packit.yaml]
    srpm_build_deps: [rpmdevtools, golang, tar, gzip]
    actions:
      create-archive: bash ../../.packit/prepare-sources.sh actionlint
      fix-spec-file: 'true'
  gomi:
    specfile_path: gomi.spec
    downstream_package_name: gomi
    paths: [packages/gomi, .packit, .packit.yaml]
    srpm_build_deps: [rpmdevtools, golang, tar, gzip]
    actions:
      create-archive: bash ../../.packit/prepare-sources.sh gomi
