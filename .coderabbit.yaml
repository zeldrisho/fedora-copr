reviews:
  profile: chill
  poem: false
  suggested_reviewers: false
  path_instructions:
    - path: "packages/**"
      instructions: |
        This is a personal COPR, not an official Fedora submission. Focus on concrete build,
        runtime, update, security, and redistribution problems. Check source integrity,
        target toolchains, dependencies, notices, patch applicability, and meaningful
        offline tests. Documented prebuilt components and per-package network exceptions
        are intentional; do not demand source rebuilds, exhaustive dependency-license
        inventories, cosmetic lint, or changelog entries for unpublished fixes. Explain
        the failure scenario and distinguish evidence from assumptions.
    - path: ".github/**"
      instructions: |
        Review workflow permissions, untrusted input and artifacts, credential exposure,
        patch validation, and failure propagation. Verify security findings against the
        actual trust boundary and identify a concrete exploit or failure scenario.
    - path: ".packit/**"
      instructions: |
        Check source preparation, package paths, target compatibility, and failure handling.
    - path: ".packit.yaml"
      instructions: |
        Check source preparation and target compatibility; package PR and main-branch
        build jobs must be enabled or disabled together.
    - path: "docs/**"
      instructions: |
        Flag incorrect commands, misleading validation claims, and broken installation
        guidance. Avoid cosmetic rewrites or requirements that add maintenance without
        solving a concrete problem.
knowledge_base:
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
      - "docs/development.md"
