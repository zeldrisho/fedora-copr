name: Install Fedora RPM tools
description: Install Fedora RPM tooling using the available DNF version
inputs:
  packages:
    description: Space-separated DNF package names
    required: true
runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: dnf -y install $PACKAGES
