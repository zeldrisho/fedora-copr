name: CI

on:
  pull_request:
    paths:
      - '.copr/**'
      - '.github/workflows/ci.yml'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - '.copr/**'
      - '.github/workflows/ci.yml'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Git for checkout
        run: dnf -y install git
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install RPM validation tools
        run: dnf -y install go-rpm-macros go-vendor-tools make python3 rpm-build rpmdevtools rpmlint
      - name: Trust workspace for Git checks in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run validation unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check package EVR bumps
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_REF" =~ ^0+$ ]]; then
            echo 'Skipping EVR comparison for the initial push.'
          else
            python3 scripts/check_nvr.py "$BASE_REF"
          fi
      - name: Validate packages and retain SRPMs
        run: python3 scripts/validate.py --srpm-dir "$RUNNER_TEMP/srpms"
      - name: Upload validated SRPMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-srpms
          path: ${{ runner.temp }}/srpms/**/*.src.rpm
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build changed packages (${{ matrix.chroot }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chroot: [fedora-44-x86_64, fedora-45-x86_64, fedora-rawhide-x86_64]
    container:
      image: fedora:latest
      options: --privileged
    timeout-minutes: 360
    steps:
      - name: Install Git for checkout
        run: dnf -y install git
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Mock and RPM build tools
        run: dnf -y install go-rpm-macros go-vendor-tools make mock mock-core-configs rpm-build rpmdevtools rpmlint
      - name: Verify container runtime utilities
        run: command -v python3 useradd runuser
      - name: Trust workspace for Git checks in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download validated SRPMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-srpms
          path: ${{ runner.temp }}/srpms
      - name: Build changed packages in Mock
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/build_rpms.py '${{ matrix.chroot }}' --base-ref "$BASE_REF" --srpm-dir "$RUNNER_TEMP/srpms" --workdir "$RUNNER_TEMP/mock-results"
      - name: Upload Mock logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mock-logs-${{ matrix.chroot }}
          path: ${{ runner.temp }}/mock-results/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [validate, build]
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 360
    concurrency:
      group: copr-publish
      cancel-in-progress: false
    env:
      COPR_PROJECT: zeldrisho/packages
    steps:
      - name: Install COPR client, Git and Python
        run: dnf -y install copr-cli git
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust workspace for Git checks in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Sync changed package recipes and submit builds
        shell: bash
        run: |
          set -euo pipefail
          packages=$(python3 scripts/changed_packages.py --publish "$GITHUB_EVENT_BEFORE")
          if [[ -z "$packages" ]]; then
            echo 'No package build inputs changed; nothing to publish.'
            exit 0
          fi
          test -n "$COPR_CONFIG" || { echo 'COPR_CONFIG secret is required' >&2; exit 1; }
          umask 077
          config_path="$(mktemp)"
          trap 'rm -f "$config_path"' EXIT
          printf '%s\n' "$COPR_CONFIG" > "$config_path"
          copr=(copr-cli --config "$config_path")
          package_names="$("${copr[@]}" list-package-names "$COPR_PROJECT")"

          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            common_args=(
              "$COPR_PROJECT"
              --name "$package"
              --clone-url https://github.com/zeldrisho/fedora-copr.git
              --commit "$GITHUB_SHA"
              --subdir "packages/$package"
              --spec "$package.spec"
              --type git
              --method make_srpm
              --webhook-rebuild off
            )
            if grep -Fxq "$package" <<<"$package_names"; then
              "${copr[@]}" edit-package-scm "${common_args[@]}"
            else
              "${copr[@]}" add-package-scm "${common_args[@]}"
            fi
            build_output="$("${copr[@]}" build-package "$COPR_PROJECT" --name "$package")"
            printf '%s\n' "### $package COPR submission" "$build_output" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$packages"
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
