name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.copr/**'
      - '.github/workflows/ci.yml'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install RPM validation tools
        run: dnf -y install dnf-plugins-core git go-rpm-macros go-vendor-tools make python3 rpm-build rpmdevtools rpmlint
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust workspace for Git checks in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run validation unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check package EVR bumps
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_REF" =~ ^0+$ ]]; then
            echo 'Skipping EVR comparison for the initial push.'
          else
            python3 scripts/check_nvr.py "$BASE_REF"
          fi
      - name: Validate packages
        run: make validate
      - name: Build and inspect binary RPMs
        shell: bash
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BASE_REF" =~ ^0+$ ]]; then
            packages=$(python3 scripts/changed_packages.py)
          else
            packages=$(python3 scripts/changed_packages.py "$BASE_REF")
          fi
          for package in $packages; do
            spec="packages/$package/$package.spec"
            dnf builddep -y "$spec"
            mkdir -p /tmp/srpms
            (cd "packages/$package" && make -f ../../.copr/Makefile srpm \
              spec="$package.spec" outdir=/tmp/srpms)
            rpmbuild --rebuild /tmp/srpms/"$package"-*.src.rpm
            mapfile -t rpms < <(find ~/rpmbuild/RPMS -type f -name '*.rpm' | sort)
            test "${#rpms[@]}" -gt 0
            rpmlint "${rpms[@]}"
            if [[ "$package" == actionlint ]]; then
              rpm_file=$(find ~/rpmbuild/RPMS -name 'actionlint-[0-9]*.rpm' -print -quit)
              test -n "$rpm_file"
              rpm -qp --licensefiles "$rpm_file"
              rpm -qp --provides "$rpm_file" | grep -q '^bundled(golang('
              rpm -qp --scripts "$rpm_file"
              dnf -y install "$rpm_file"
              actionlint --version
              printf 'name: CI smoke test\non:\n  push:\njobs:\n  check:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo hello\n' > /tmp/actionlint-smoke.yml
              actionlint /tmp/actionlint-smoke.yml
            fi
            rm -rf ~/rpmbuild/RPMS/* ~/rpmbuild/BUILD/* ~/rpmbuild/BUILDROOT/* ~/rpmbuild/SOURCES/* ~/rpmbuild/SPECS/*
          done

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 360
    concurrency:
      group: copr-publish
      cancel-in-progress: false
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      COPR_PROJECT: zeldrisho/packages
    steps:
      - name: Install COPR client and Python
        run: dnf -y install copr-cli python3
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync changed package recipes and submit builds
        shell: bash
        run: |
          set -euo pipefail
          packages=$(python3 scripts/changed_packages.py "$GITHUB_EVENT_BEFORE")
          if [[ -z "$packages" ]]; then
            echo 'No package build inputs changed; nothing to publish.'
            exit 0
          fi
          test -n "$COPR_CONFIG" || { echo 'COPR_CONFIG secret is required' >&2; exit 1; }
          umask 077
          config_path="$(mktemp)"
          trap 'rm -f "$config_path"' EXIT
          printf '%s\n' "$COPR_CONFIG" > "$config_path"
          copr=(copr-cli --config "$config_path")
          package_names="$("${copr[@]}" list-package-names "$COPR_PROJECT")"

          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            common_args=(
              "$COPR_PROJECT"
              --name "$package"
              --clone-url https://github.com/zeldrisho/fedora-copr.git
              --commit "$GITHUB_SHA"
              --subdir "packages/$package"
              --spec "$package.spec"
              --type git
              --method make_srpm
              --webhook-rebuild off
            )
            if grep -Fxq "$package" <<<"$package_names"; then
              "${copr[@]}" edit-package-scm "${common_args[@]}"
            else
              "${copr[@]}" add-package-scm "${common_args[@]}"
            fi
            build_output="$("${copr[@]}" build-package "$COPR_PROJECT" --name "$package")"
            printf '%s\n' "### $package COPR submission" "$build_output" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$packages"
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
