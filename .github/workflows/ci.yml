name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
  pull_request:
    paths:
      - '.copr/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - '.copr/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Git for checkout
        run: dnf -y install git
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install RPM validation tools
        run: dnf -y install go-rpm-macros go-vendor-tools make python3 rpm-build rpmdevtools rpmlint
      - name: Trust workspace for Git checks in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run validation unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check package EVR bumps
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_REF" =~ ^0+$ ]]; then
            echo 'Skipping EVR comparison for the initial push.'
          else
            python3 scripts/check_nvr.py "$BASE_REF"
          fi
      - name: Verify package source checksums
        shell: bash
        run: |
          shopt -s nullglob
          for manifest in packages/*/docs/checksums.sha256; do
            sha256sum --check "$manifest"
          done
      - name: Validate packages
        run: python3 scripts/validate.py
      - name: Test Yazi syntax database filter
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$BASE_REF" =~ ^0+$ ]]; then
            changed=$(git diff --name-only "$BASE_REF" HEAD)
            if ! grep -q '^packages/yazi/scripts/filter-syntax-database/' <<< "$changed"; then
              echo 'Yazi filter unchanged; skipping.'
              exit 0
            fi
          fi
          dnf -y install cargo rust oniguruma-devel
          cargo test --locked --manifest-path packages/yazi/scripts/filter-syntax-database/Cargo.toml

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 360
    concurrency:
      group: copr-publish
      cancel-in-progress: false
    env:
      COPR_PROJECT: zeldrisho/packages
    steps:
      - name: Install COPR client, Git and Python
        run: dnf -y install copr-cli git python3
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust workspace for Git checks in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Sync changed package recipes and submit builds
        shell: bash
        run: |
          set -euo pipefail
          packages=$(python3 .github/scripts/changed_packages.py --publish "$GITHUB_EVENT_BEFORE")
          if [[ -z "$packages" ]]; then
            echo 'No package build inputs changed; nothing to publish.'
            exit 0
          fi
          test -n "$COPR_CONFIG" || { echo 'COPR_CONFIG secret is required' >&2; exit 1; }
          umask 077
          config_path="$(mktemp)"
          trap 'rm -f "$config_path"' EXIT
          printf '%s\n' "$COPR_CONFIG" > "$config_path"
          copr=(copr-cli --config "$config_path")
          package_names="$("${copr[@]}" list-package-names "$COPR_PROJECT")"
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            common_args=("$COPR_PROJECT" --name "$package" --clone-url https://github.com/zeldrisho/fedora-copr.git --commit "$GITHUB_SHA" --subdir "packages/$package" --spec "$package.spec" --type git --method make_srpm --webhook-rebuild off)
            if grep -Fxq "$package" <<<"$package_names"; then
              "${copr[@]}" edit-package-scm "${common_args[@]}"
            else
              "${copr[@]}" add-package-scm "${common_args[@]}"
            fi
            build_output="$("${copr[@]}" build-package "$COPR_PROJECT" --name "$package")"
            printf '%s\n' "### $package COPR submission" "$build_output" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$packages"
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  upstream-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/check_upstream.py
