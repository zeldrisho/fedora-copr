name: COPR publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names to validate and submit (for example, herdr,yazi)
        required: true
        type: string

permissions:
  contents: read

jobs:
  manual-validation:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [manual-validation]
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 360
    concurrency:
      group: copr-publish
      cancel-in-progress: false
    env:
      COPR_PROJECT: zeldrisho/packages
    steps:
      - name: Install COPR client, Git and Python
        run: dnf -y install copr-cli git python3
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust workspace for Git checks in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Sync package recipes and submit builds
        shell: bash
        run: |
          set -euo pipefail
          packages=$(python3 .github/scripts/select_packages.py "$PUBLISH_PACKAGES")
          test -n "$COPR_CONFIG" || { echo 'COPR_CONFIG secret is required' >&2; exit 1; }
          umask 077
          config_path="$(mktemp)"
          trap 'rm -f "$config_path"' EXIT
          printf '%s\n' "$COPR_CONFIG" > "$config_path"
          copr=(copr-cli --config "$config_path")
          package_names="$("${copr[@]}" list-package-names "$COPR_PROJECT")"
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            common_args=("$COPR_PROJECT" --name "$package" --clone-url https://github.com/zeldrisho/fedora-copr.git --commit "$PUBLISH_SHA" --subdir "packages/$package" --spec "$package.spec" --type git --method make_srpm --webhook-rebuild off)
            if grep -Fxq "$package" <<<"$package_names"; then
              "${copr[@]}" edit-package-scm "${common_args[@]}"
            else
              "${copr[@]}" add-package-scm "${common_args[@]}"
            fi
            build_output="$("${copr[@]}" build-package "$COPR_PROJECT" --name "$package" --nowait)"
            printf '%s\n' "### $package COPR submission" "$build_output" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$build_output"
          done <<< "$packages"
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          PUBLISH_PACKAGES: ${{ inputs.packages }}
          PUBLISH_SHA: ${{ github.sha }}
